<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Brew Café | Premium Coffee Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================
           CSS VARIABLES & ROOT CONFIGURATION
           ============================================ */
        :root {
            --coffee-dark: #1a0f0a;
            --coffee-medium: #2d1810;
            --coffee-light: #4a2c1a;
            --coffee-accent: #6b4423;
            --gold-primary: #c9a227;
            --gold-light: #d4af37;
            --gold-dark: #aa8822;
            --cream: #f5e6d3;
            --white-cream: #faf6f0;
            --glass-bg: rgba(45, 24, 16, 0.6);
            --glass-border: rgba(201, 162, 39, 0.3);
            --shadow-gold: rgba(201, 162, 39, 0.4);
            --steam-color: rgba(255, 248, 240, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-medium) 50%, var(--coffee-dark) 100%);
            color: var(--cream);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ============================================
           CUSTOM SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--coffee-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-dark), var(--gold-primary));
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--gold-primary), var(--gold-light));
        }

        /* ============================================
           FLOATING COFFEE BEANS ANIMATION
           ============================================ */
        .floating-beans-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .coffee-bean {
            position: absolute;
            width: 20px;
            height: 30px;
            background: linear-gradient(135deg, var(--coffee-accent), var(--coffee-light));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0.15;
            animation: floatBean linear infinite;
        }

        .coffee-bean::before {
            content: '';
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 3px;
            background: var(--coffee-dark);
            border-radius: 2px;
        }

        @keyframes floatBean {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.15;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        /* ============================================
           SMOKE/FOG EFFECT
           ============================================ */
        .smoke-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(107, 68, 35, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(107, 68, 35, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: 2;
        }

        .smoke-particle {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
            animation: smokeFloat 15s ease-in-out infinite;
        }

        @keyframes smokeFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            25% {
                transform: translate(100px, -50px) scale(1.5);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50px, -100px) scale(2);
                opacity: 0.3;
            }
            75% {
                transform: translate(50px, -150px) scale(1.8);
                opacity: 0.4;
            }
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: linear-gradient(180deg, rgba(26, 15, 10, 0.9) 0%, transparent 100%);
            transition: all 0.4s ease;
        }

        .navbar.scrolled {
            background: rgba(26, 15, 10, 0.95);
            padding: 15px 50px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--shadow-gold);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow: 0 0 30px var(--shadow-gold);
            }
            50% {
                box-shadow: 0 0 50px var(--shadow-gold), 0 0 80px rgba(201, 162, 39, 0.2);
            }
        }

        .logo-icon i {
            color: var(--coffee-dark);
            font-size: 24px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold-light), var(--cream));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--cream);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            padding: 10px 0;
            transition: all 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
            transition: width 0.4s ease;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
            text-shadow: 0 0 20px var(--shadow-gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-order-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            border-radius: 30px;
            color: var(--coffee-dark);
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px var(--shadow-gold);
        }

        .nav-order-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px var(--shadow-gold);
        }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 1001;
        }

        .mobile-menu-btn span {
            width: 35px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 120px 50px 50px;
        }

        .hero-bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(201, 162, 39, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
        }

        .hero-badge {
            display: inline-block;
            padding: 10px 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            animation: fadeInDown 1s ease;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--cream) 0%, var(--gold-light) 50%, var(--cream) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        .hero-subtitle {
            font-size: 18px;
            line-height: 1.8;
            color: rgba(245, 230, 211, 0.8);
            margin-bottom: 40px;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .btn-primary {
            padding: 18px 45px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            border-radius: 50px;
            color: var(--coffee-dark);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px var(--shadow-gold);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px var(--shadow-gold);
        }

        .btn-secondary {
            padding: 18px 45px;
            background: transparent;
            border: 2px solid var(--gold-primary);
            border-radius: 50px;
            color: var(--gold-primary);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-secondary:hover {
            background: var(--gold-primary);
            color: var(--coffee-dark);
            transform: translateY(-5px);
            box-shadow: 0 15px 50px var(--shadow-gold);
        }

        /* ============================================
           3D COFFEE CUP
           ============================================ */
        .coffee-cup-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .coffee-cup {
            position: relative;
            width: 350px;
            height: 400px;
            animation: floatCup 6s ease-in-out infinite;
        }

        @keyframes floatCup {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .cup-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 250px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 50%, #f5f5f5 100%);
            border-radius: 10px 10px 80px 80px;
            box-shadow: 
                inset -20px 0 40px rgba(0,0,0,0.1),
                inset 20px 0 40px rgba(0,0,0,0.05),
                0 30px 60px rgba(0,0,0,0.4);
        }

        .cup-handle {
            position: absolute;
            right: -50px;
            top: 60px;
            width: 60px;
            height: 100px;
            border: 15px solid #e0
