<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodren Coffee - Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero-section">
        <nav class="navbar">
            <div class="logo">BODREN</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Reviews</a></li>
            </ul>
            <button class="order-btn">Order Now</button>
        </nav>

        <div class="hero-content">
            <h1>Discover Premium Taste <br><span>In Every Sip</span></h1>
            <p>Our coffee is not just a drink, it's an art. Experience the unique culinary journey.</p>
        </div>

        <div class="center-display">
            <div class="coffee-splash"></div>
            <div class="cup-container">
                <img id="main-cup" src="https://via.placeholder.com/300x400/4a2c11/ffffff?text=Cappuccino" alt="Coffee Cup">
            </div>
        </div>

        <div class="slider-container">
            <button class="slider-arrow prev-btn">&#10094;</button>
            
            <div class="flavor-slider">
                <div class="flavor-card active" data-flavor="cappuccino" data-img="https://via.placeholder.com/300x400/4a2c11/ffffff?text=Cappuccino">
                    <h3>Cappuccino</h3>
                    <p>120 p.</p>
                </div>
                <div class="flavor-card" data-flavor="latte" data-img="https://via.placeholder.com/300x400/5c4033/ffffff?text=Latte">
                    <h3>Latte</h3>
                    <p>140 p.</p>
                </div>
                <div class="flavor-card" data-flavor="mocha" data-img="https://via.placeholder.com/300x400/2b1d0c/ffffff?text=Mocha">
                    <h3>Mocha</h3>
                    <p>140 p.</p>
                </div>
            </div>

            <button class="slider-arrow next-btn">&#10095;</button>
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
